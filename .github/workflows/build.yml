name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Android SDK components
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          # Accept licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # Install missing components
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Decode signing keystore
        run: echo "${{ secrets.DOKI_KEYSTORE_B64 }}" | base64 -d > "${{ github.workspace }}/doki.keystore"

      - name: Build Debug APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          DOKI_KEYSTORE: ${{ github.workspace }}/doki.keystore
          DOKI_STORE_PASS: ${{ secrets.DOKI_STORE_PASS }}
          DOKI_KEY_ALIAS: ${{ secrets.DOKI_KEY_ALIAS }}
          DOKI_KEY_PASS: ${{ secrets.DOKI_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK signature
        if: success()
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      # - name: Publish Release
      #   if: success()
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
      #     if gh release view "v$VER" --repo lihongxi-g/wooden-fish > /dev/null 2>&1; then
      #       gh release upload "v$VER" app/build/outputs/apk/debug/app-debug.apk --repo lihongxi-g/wooden-fish --clobber
      #     else
      #       gh release create "v$VER" app/build/outputs/apk/debug/app-debug.apk \
      #         --repo lihongxi-g/wooden-fish \
      #         --title "Doki v$VER" \
      #         --notes "Doki 电子木鱼 v$VER 自动构建发布"
      #     fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: doki-debug
          path: app/build/outputs/apk/debug/app-debug.apk
